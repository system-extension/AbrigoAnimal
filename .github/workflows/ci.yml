# Roda a cada push e pull request: nada chega na main sem testes verdes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # O runner do GitHub já tem Docker: os testes de integração sobem o Postgres via Testcontainers
      - name: Testes (unidade + integração + arquitetura)
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Documentação dos módulos (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint e formatação
        run: npm run lint && npm run format:check
      # Mesmo build que vai para produção (embutido no jar)
      - name: Build de produção
        run: npm run build

  # Monta a mesma imagem que vai para produção (Dockerfile da raiz), sem publicar.
  # Garante que o deploy não quebra por causa do Dockerfile ou do .dockerignore.
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem de produção
        run: docker build -t abrigo-animal:ci .
