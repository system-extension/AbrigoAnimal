# Configuração única. Tudo que muda entre ambientes vem de VARIÁVEL DE AMBIENTE
# (valor depois dos ":" é o padrão para desenvolvimento local). Nenhum segredo aqui.
spring:
  application:
    name: abrigo-animal

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/abrigo}
    username: ${DB_USER:abrigo}
    password: ${DB_PASSWORD:abrigo}
    hikari:
      maximum-pool-size: ${DB_POOL:5}   # poucos usuários: pool pequeno economiza memória/conexões

  jpa:
    open-in-view: false          # força montar as respostas dentro da transação (evita consultas escondidas)
    hibernate:
      ddl-auto: validate         # quem cria/altera tabelas é o Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  web:
    resources:
      add-mappings: false        # arquivos estáticos são servidos pelo SpaConfig (fallback de SPA)

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true          # cria a tabela event_publication do Modulith
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  # Desligado de propósito: o "framework" confiava no X-Forwarded-For que QUALQUER visitante pode
  # forjar. O IP real é decidido em IpDoCliente (abrigo.ip-cliente abaixo, ADR 0013).
  forward-headers-strategy: none
  # Compacta o que é texto (site, API): o JS do React cai de ~380 kB para ~115 kB na rede.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}  # true em produção (HTTPS)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

abrigo:
  url-publica: ${URL_PUBLICA:http://localhost:8080}
  # Onde ficam as fotos (ADR 0007 e 0015): "disco" (pasta local) ou "s3" (Cloudflare R2 em produção).
  armazenamento:
    tipo: ${ARMAZENAMENTO_TIPO:disco}
    diretorio: ${ARMAZENAMENTO_DIR:./dados/arquivos}
    s3:
      endpoint: ${S3_ENDPOINT:}            # R2: https://<id-da-conta>.r2.cloudflarestorage.com
      regiao: ${S3_REGIAO:auto}            # R2 usa "auto"
      bucket: ${S3_BUCKET:}
      chave-acesso: ${S3_CHAVE_ACESSO:}
      chave-secreta: ${S3_CHAVE_SECRETA:}
      # Endereço público do bucket (ex.: https://fotos.dominio-da-ong.org.br). Vazio = as fotos
      # passam pelo backend em /arquivos/...; preenchido = o navegador busca direto da Cloudflare.
      url-publica: ${ARMAZENAMENTO_URL_PUBLICA:}
      # Só desenvolvimento: cria o bucket se ele não existir. Em produção o bucket é criado no painel.
      criar-bucket: ${S3_CRIAR_BUCKET:false}
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  solicitacoes:
    limite-por-hora: ${SOLICITACOES_LIMITE_HORA:5}
  # De onde vem o IP do visitante (IpDoCliente). Em produção, definido depois de MEDIR o proxy
  # do Railway (docs/producao.md). Modos: CONEXAO, X_FORWARDED_FOR_ULTIMO,
  # X_FORWARDED_FOR_PRIMEIRO, X_REAL_IP.
  ip-cliente:
    modo: ${IP_CLIENTE_MODO:CONEXAO}
    diagnostico: ${IP_CLIENTE_DIAGNOSTICO:false}  # true só durante a medição: registra os cabeçalhos
  # Proteção do login (ADR 0013).
  login:
    erros-por-email: 5          # par e-mail + IP: bloqueio permanente
    emails-por-ip: 3            # IP que erra tantos e-mails diferentes...
    janela-emails-por-ip: 1h    # ...neste tempo: bloqueio permanente do IP
    erros-por-conta: 10         # rede de segurança que não depende de IP: tantos erros na conta...
    janela-erros-por-conta: 15m # ...neste tempo, vindos de qualquer lugar: recusa por este tempo

logging:
  level:
    br.org.abrigo: INFO
