<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173b31"><title>Minhas solicitações | Abrigo Animal Joinville</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"></header><main class="shell"><section class="panel"><p class="ey">Acompanhamento</p><h1>Minhas solicitações</h1><p class="lead">A equipe analisa cada pedido e entra em contato pelo telefone informado.</p><div id="lista" class="list"></div></section></main><footer class="foot"></footer><script src="/conta.js"></script><script src="/layout-compartilhado.js"></script><script>if(exigirLogin()){const xs=minhasSolicitacoes(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));lista.innerHTML=xs.length?xs.map(x=>`<article class="request"><span class="tag">${x.tipo==='adocao'?'Adoção':'Apadrinhamento'}</span><h2>${esc(x.pet)}</h2><p class="muted">Enviada em ${esc(x.data)} · Status: <b>${esc(x.status||'Recebida')}</b></p><p>${esc(x.mensagem)}</p></article>`).join(''):'<article class="request"><h2>Ainda não há solicitações.</h2><p class="muted">Quando você escolher um cão, o pedido aparecerá aqui.</p><a class="btn" href="/animais.html">Conhecer os cães</a></article>'}</script></body></html>
