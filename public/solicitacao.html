<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173b31"><title>Solicitação | Abrigo Animal Joinville</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"></header><main class="shell"><section class="panel"><p class="ey" id="ey">Solicitação</p><h1 id="titulo">Vamos dar o próximo passo.</h1><p class="lead" id="desc"></p><div id="alert" class="alert" role="status"></div><form id="form" class="grid"><p class="form-note full">Seus dados foram preenchidos com base no cadastro. Você pode corrigi-los antes de enviar.</p><label>Nome do cão<input id="pet" readonly></label><label>Nome completo<input required name="nomeUsuario" id="nomeUsuario" autocomplete="name"></label><label>CPF<input required name="cpf" id="cpf" inputmode="numeric" placeholder="000.000.000-00"></label><label>Telefone<input required name="telefone" id="telefone" autocomplete="tel" inputmode="tel"></label><label class="full">E-mail<input required type="email" name="email" id="email" autocomplete="email"></label><label>CEP<input required name="cep" id="cep" inputmode="numeric" autocomplete="postal-code"></label><label>Endereço completo<input required name="endereco" id="endereco" autocomplete="street-address"></label><label class="full">Conte um pouco sobre sua rotina e como pretende cuidar do cão<textarea required name="mensagem"></textarea></label><label class="full">Melhor horário para contato<select name="horario"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></label><div class="actions full"><button class="btn" type="submit" id="enviar"></button><a class="secondary btn" href="/animais.html">Voltar aos cães</a></div></form></section></main><footer class="foot"></footer><script src="/conta.js"></script><script src="/layout-compartilhado.js"></script><script>const params=new URLSearchParams(location.search),tipo=params.get('tipo')==='apadrinhamento'?'apadrinhamento':'adocao',nome=params.get('pet')||'este cão';if(exigirLogin()){const u=usuarioAtual(),campos=['nomeUsuario','cpf','telefone','email','cep','endereco'];pet.value=nome;campos.forEach(k=>document.getElementById(k).value=u[k==='nomeUsuario'?'nome':k]||'');ey.textContent=tipo==='adocao'?'Formulário de adoção':'Formulário de apadrinhamento';titulo.textContent=tipo==='adocao'?`Quero adotar ${nome}`:`Quero apadrinhar ${nome}`;desc.textContent=tipo==='adocao'?'Conte para a equipe como será a chegada do novo membro da família.':'Seu apoio ajuda nos cuidados de um cão idoso.';enviar.textContent=tipo==='adocao'?'Enviar solicitação de adoção':'Enviar solicitação de apadrinhamento';form.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));salvarSolicitacao({tipo,pet:nome,...d,data:new Date().toLocaleDateString('pt-BR'),status:'Recebida'});notice('Solicitação enviada. Você pode acompanhar o pedido no seu perfil.');form.reset();pet.value=nome;campos.forEach(k=>document.getElementById(k).value=u[k==='nomeUsuario'?'nome':k]||'')})}</script></body></html>
