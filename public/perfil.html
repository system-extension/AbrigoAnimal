<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173b31"><title>Meu perfil | Abrigo Animal Joinville</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"></header><main class="shell"><section class="panel profile-card" id="perfil"></section></main><footer class="foot"></footer><script src="/conta.js"></script><script src="/layout-compartilhado.js"></script><script>
if(exigirLogin()){const u=usuarioAtual(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sol=minhasSolicitacoes();if(u.admin){const pedidos=JSON.parse(localStorage.getItem('abrigo_solicitacoes_demo')||'[]'),pets=JSON.parse(localStorage.getItem('abrigo_animais_admin')||'[]'),linha=x=>`<article class="activity-row"><span class="tag">${esc(x.status||'Recebida')}</span><div><b>${esc(x.pet)}</b><small>${esc(x.nomeUsuario||x.email||'Usuário')}</small></div><time>${esc(x.data||'Hoje')}</time></article>`;perfil.innerHTML=`<p class="ey">Área administrativa</p><section class="admin-profile-hero"><img src="/assets/images/logo.png" alt=""><div><h1>Abrigo Animal Joinville</h1><p>Atividades mais recentes do abrigo.</p></div><a class="btn" href="/admin.html">Abrir painel</a></section><div class="admin-activity-grid"><section><h2>Últimas adoções</h2>${pedidos.filter(x=>x.tipo==='adocao').slice(0,3).map(linha).join('')||'<p>Nenhuma solicitação.</p>'}</section><section><h2>Últimos apadrinhamentos</h2>${pedidos.filter(x=>x.tipo==='apadrinhamento').slice(0,3).map(linha).join('')||'<p>Nenhuma solicitação.</p>'}</section><section><h2>Últimos cães cadastrados</h2>${pets.slice(-3).reverse().map(x=>`<article class="activity-row"><img src="${esc(x.foto||'/assets/images/cao-card.jpg')}" alt=""><div><b>${esc(x.nome)}</b><small>${esc(x.idade)} · ${esc(x.porte)}</small></div></article>`).join('')||'<p>Nenhum cão cadastrado.</p>'}</section></div><div class="actions"><button class="logout-button" onclick="sair()">Sair da conta</button></div>`}else{perfil.innerHTML=`<p class="ey">Meu perfil</p><section class="profile-hero"><div class="avatar-placeholder" aria-hidden="true">${esc((u.nome||'U').charAt(0).toUpperCase())}</div><div><h1>${esc(u.nome||'Usuário')}</h1><p>${esc(u.email)}</p></div></section><div class="stats"><div class="stat"><b>${sol.length}</b><span>solicitações</span></div><div class="stat"><b>${sol.filter(x=>x.tipo==='adocao').length}</b><span>adoções</span></div><div class="stat"><b>${sol.filter(x=>x.tipo==='apadrinhamento').length}</b><span>apadrinhamentos</span></div></div><div class="quick"><a href="/solicitacoes.html">Acompanhar solicitações</a><a href="/animais.html">Conhecer os cães</a></div><h2 class="profile-data-title">Dados de contato</h2><div class="list"><p><b>Telefone</b><br>${esc(u.telefone||'Não informado')}</p><p><b>CPF</b><br>${esc(u.cpf||'Não informado')}</p><p><b>Endereço</b><br>${esc(u.endereco||'Não informado')} · ${esc(u.cep||'')}</p></div><div class="actions"><button class="logout-button" onclick="sair()">Sair da conta</button></div>`}}</script></body></html>
