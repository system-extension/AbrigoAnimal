<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173b31"><title>Perfil do cão | Abrigo Animal Joinville</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"></header><main class="main" id="perfil" aria-live="polite"><p class="estado-carregando">Carregando o perfil…</p></main><footer class="foot"></footer>
<script>const id=new URLSearchParams(location.search).get('id'),cores=['Caramelo e branco','Preto e branco','Marrom','Dourado','Caramelo','Tigrado'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/animais/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{const cor=cores[(+a.id-1)%cores.length],foto=esc(a.urlFoto),idoso=+((String(a.idade).match(/\d+/)||[0])[0])>=8;document.title=`${a.nome} | Abrigo Animal Joinville`;document.querySelector('#perfil').innerHTML=`<div class="grid"><section class="gallery" aria-label="Fotos de ${esc(a.nome)}"><img src="${foto}" alt="Foto principal de ${esc(a.nome)}"><img src="${foto}" alt="Outra foto de ${esc(a.nome)}"><img src="${foto}" alt="Detalhe de ${esc(a.nome)}"></section><section><p class="eyebrow">Cão para adoção</p><h1>${esc(a.nome)}</h1><p class="intro">${esc(a.descricao)}</p><dl class="facts"><div class="fact"><dt>Idade</dt><dd>${esc(a.idade)}</dd></div><div class="fact"><dt>Sexo</dt><dd>${a.sexo==='femea'?'Fêmea':'Macho'}</dd></div><div class="fact"><dt>Cor</dt><dd>${cor}</dd></div><div class="fact"><dt>Porte</dt><dd>${esc(a.porte)}</dd></div><div class="fact"><dt>Vacinas</dt><dd>${a.vacinado?'Em dia':'Pendente'}</dd></div><div class="fact"><dt>Castração</dt><dd>${a.castrado?'Castrado':'Não castrado'}</dd></div></dl><div class="actions"><a class="btn" href="/solicitacao.html?tipo=adocao&pet=${encodeURIComponent(a.nome)}">Quero adotar ${esc(a.nome)}</a>${idoso?`<a class="btn secondary" href="/solicitacao.html?tipo=apadrinhamento&pet=${encodeURIComponent(a.nome)}">Apadrinhar ${esc(a.nome)}</a>`:''}</div></section></div>`}).catch(()=>document.querySelector('#perfil').innerHTML='<p class="estado-carregando">Cão não encontrado.</p>')</script>
<script src="/layout-compartilhado.js"></script></body></html>
