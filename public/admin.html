<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo | Abrigo Animal Joinville</title><link rel="stylesheet" href="/styles.css"></head><body><main class="admin-layout" id="app"></main><script src="/conta.js"></script><script>
const admin=usuarioAtual();
if(!admin||admin.email!=='admin@abrigo.com.br'){location.href='/login.html?voltar='+encodeURIComponent('/admin.html')}else{
 const get=k=>JSON.parse(localStorage.getItem(k)||'[]'), set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
 const pedidos=()=>get('abrigo_solicitacoes_demo'), roles=()=>get('abrigo_role_agendamentos'), estoque=()=>get('abrigo_estoque_demo'), lancamentos=()=>get('abrigo_financeiro_demo'), animais=()=>get('abrigo_animais_admin');
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icons={dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',animais:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/><circle cx="8.2" cy="6.4" r="1.2"/><circle cx="15.8" cy="6.4" r="1.2"/></svg>',adocao:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19v-7l4-3 4 3v7"/><path d="M12 19v-9l4-3 4 3v9"/><path d="M8 14h.01M16 12h.01"/></svg>',apadrinhamento:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/><path d="m8.5 13 2 2 4-4"/></svg>',estoque:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>',financeiro:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',role:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M17 3v4M4 9h16M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m9 15 2 2 4-4"/></svg>'};
 const menu=[['dashboard','Dashboard'],['animais','Cadastrar animal'],['adocao','Acompanhar adoções'],['apadrinhamento','Apadrinhamento'],['estoque','Estoque'],['financeiro','Financeiro'],['role','Agendamento de Rolê']];
 app.innerHTML=`<aside class="admin-sidebar" id="adminSidebar"><button class="admin-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">Menu</button><a class="admin-brand" href="/"><img src="/assets/images/logo.png" alt="Logo Abrigo Animal Joinville"><span>Abrigo Animal<br>Joinville</span></a><p class="admin-side-label">PAINEL DE CONTROLE</p><nav class="admin-side-menu">${menu.map(([id,label])=>`<button data-tab="${id}" class="${id==='dashboard'?'active':''}">${icons[id]}<span>${label}</span></button>`).join('')}</nav><div class="admin-side-bottom"><a href="/perfil.html">Resumo de atividades</a><button onclick="sair()">Sair da conta</button></div></aside><section class="admin-content"><header class="admin-content-head"><div><p class="ey">ÁREA ADMINISTRATIVA</p><h1 id="pageTitle">Dashboard</h1><p class="lead" id="pageLead">Acompanhe as atividades do abrigo.</p></div><a class="btn outline-admin" href="/">Ver site</a></header><div id="conteudo"></div></section>`;
 const metas={dashboard:['Dashboard','Acompanhe as atividades do abrigo.'],animais:['Cadastrar animal','Inclua novos cães no catálogo.'],adocao:['Acompanhar adoções','Veja os pedidos de adoção recebidos.'],apadrinhamento:['Apadrinhamento','Veja os pedidos de apadrinhamento.'],estoque:['Estoque','Registre e acompanhe os itens do abrigo.'],financeiro:['Financeiro','Registre receitas e despesas.'],role:['Agendamento de Rolê','Acompanhe as visitas solicitadas.']};
 function listaPedidos(tipo){const xs=pedidos().filter(x=>x.tipo===tipo); return xs.length?xs.map((x,i)=>`<article class="admin-entry"><div class="admin-entry-top"><span class="tag">${esc(x.status||'Recebida')}</span><small>${esc(x.data||'Hoje')}</small></div><h3>${esc(x.pet)} <small>· ${esc(x.nomeUsuario||x.email||'Usuário')}</small></h3><p><b>Contato:</b> ${esc(x.telefone||'Não informado')} · <b>CPF:</b> ${esc(x.cpf||'Não informado')}</p><p><b>Endereço:</b> ${esc(x.endereco||'Não informado')} ${x.cep?'· '+esc(x.cep):''}</p><p>${esc(x.mensagem||'Sem mensagem.')}</p><button class="tiny-btn" onclick="alterarStatus(${pedidos().indexOf(x)},'abrigo_solicitacoes_demo')">Marcar em análise</button></article>`).join(''):'<div class="admin-empty">Nenhuma solicitação registrada.</div>'}
 function render(tab='dashboard'){
   document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
   pageTitle.textContent=metas[tab][0]; pageLead.textContent=metas[tab][1]; let html='';
   if(tab==='dashboard'){const rec=lancamentos().filter(x=>x.tipo==='Receita').reduce((a,x)=>a+(+x.valor||0),0),des=lancamentos().filter(x=>x.tipo==='Despesa').reduce((a,x)=>a+(+x.valor||0),0); html=`<section class="admin-grid"><article class="admin-kpi"><b>${pedidos().filter(x=>x.tipo==='adocao').length}</b><span>adoções para analisar</span></article><article class="admin-kpi"><b>${pedidos().filter(x=>x.tipo==='apadrinhamento').length}</b><span>apadrinhamentos</span></article><article class="admin-kpi"><b>${roles().length}</b><span>rolês agendados</span></article><article class="admin-kpi"><b>R$ ${(rec-des).toFixed(2)}</b><span>saldo estimado</span></article></section><section class="admin-summary"><h2>Últimas atividades</h2><div class="admin-entry"><p><b>Estoque:</b> ${estoque().length} itens registrados</p><p><b>Animais cadastrados:</b> ${animais().length}</p><p><b>Próxima ação:</b> revise as novas solicitações e os pedidos de visita.</p></div></section>`}
   if(tab==='adocao')html=listaPedidos('adocao');
   if(tab==='apadrinhamento')html=listaPedidos('apadrinhamento');
   if(tab==='animais'){const xs=animais(); html=`<form id="animalForm" class="admin-form"><label>Nome<input required name="nome" placeholder="Nome do cão"></label><label>Idade<input required name="idade" placeholder="Ex.: 4 anos"></label><label>Sexo<select name="sexo"><option>Macho</option><option>Fêmea</option></select></label><label>Porte<select name="porte"><option>Pequeno</option><option>Médio</option><option>Grande</option></select></label><label>Vacinas<select name="vacinado"><option value="sim">Vacinas em dia</option><option value="nao">Vacinas pendentes</option></select></label><label>Castração<select name="castrado"><option value="sim">Castrado</option><option value="nao">Não castrado</option></select></label><label class="wide">Descrição<textarea required name="descricao" placeholder="Conte um pouco sobre o cão."></textarea></label><label class="wide">Foto do cão<input required type="file" accept="image/*" name="fotoArquivo"></label><div class="wide"><button class="btn">Cadastrar animal</button></div></form><div class="admin-list">${xs.length?xs.map((x,i)=>`<article class="admin-entry admin-pet-row"><img src="${esc(x.foto||'/assets/images/cao-card.png')}" alt=""><div><h3>${esc(x.nome)}</h3><p>${esc(x.idade)} · ${esc(x.sexo)} · ${esc(x.porte)}</p></div><button class="tiny-btn danger" onclick="apagarAnimal(${i})">Excluir</button></article>`).join(''):'<div class="admin-empty">Nenhum cão cadastrado manualmente.</div>'}</div>`}
   if(tab==='estoque'){const xs=estoque(); html=`<form id="estoqueForm" class="admin-form"><label>Item<input required name="item" placeholder="Ex.: Ração adulto"></label><label>Quantidade<input required type="number" min="0" name="quantidade"></label><label>Unidade<input required name="unidade" placeholder="kg, sacos, unidades"></label><div><button class="btn">Adicionar item</button></div></form><div class="admin-list">${xs.length?xs.map((x,i)=>`<article class="admin-entry admin-compact"><div><h3>${esc(x.item)}</h3><p>${esc(x.quantidade)} ${esc(x.unidade)}</p></div><button class="tiny-btn danger" onclick="apagarEstoque(${i})">Excluir</button></article>`).join(''):'<div class="admin-empty">Estoque ainda não informado.</div>'}</div>`}
   if(tab==='financeiro'){const xs=lancamentos(),saldo=xs.reduce((a,x)=>a+(x.tipo==='Receita'?+x.valor:-x.valor),0); html=`<div class="finance-balance">Saldo atual <b>R$ ${saldo.toFixed(2)}</b></div><form id="financeiroForm" class="admin-form"><label>Tipo<select name="tipo"><option>Receita</option><option>Despesa</option></select></label><label>Valor (R$)<input required type="number" min="0" step="0.01" name="valor"></label><label class="wide">Descrição<input required name="descricao" placeholder="Ex.: Doação via Pix"></label><div class="wide"><button class="btn">Registrar lançamento</button></div></form><div class="admin-list">${xs.length?xs.map((x,i)=>`<article class="admin-entry admin-compact"><div><span class="tag">${esc(x.tipo)}</span><h3>${esc(x.descricao)}</h3></div><div><b class="${x.tipo==='Receita'?'money-positive':'money-negative'}">R$ ${(+x.valor).toFixed(2)}</b><button class="tiny-btn danger" onclick="apagarFinanceiro(${i})">Excluir</button></div></article>`).join(''):'<div class="admin-empty">Nenhum lançamento financeiro.</div>'}</div>`}
   if(tab==='role'){const xs=roles(); html=xs.length?xs.map((x,i)=>`<article class="admin-entry"><div class="admin-entry-top"><span class="tag">${esc(x.status||'Aguardando confirmação')}</span><small>${esc(x.data||'Data não informada')}</small></div><h3>${esc(x.instituicao)}</h3><p>${esc(x.tipo)} · ${esc(x.participantes)} participantes · ${esc(x.periodo)}</p><p><b>Responsável:</b> ${esc(x.responsavel)} · ${esc(x.telefone)} · ${esc(x.email)}</p><button class="tiny-btn" onclick="alterarStatus(${i},'abrigo_role_agendamentos')">Marcar em análise</button></article>`).join(''):'<div class="admin-empty">Nenhum pedido de visita ainda.</div>'}
   conteudo.innerHTML=html;
   if(window.animalForm)animalForm.onsubmit=e=>{e.preventDefault();const dados=Object.fromEntries(new FormData(animalForm));const arquivo=animalForm.fotoArquivo.files[0];const salvar=x=>{x.foto=x.foto||'/assets/images/cao-card.png';set('abrigo_animais_admin',[...animais(),x]);render('animais')};if(arquivo){const leitor=new FileReader();leitor.onload=()=>salvar({...dados,foto:leitor.result});leitor.readAsDataURL(arquivo)}else salvar(dados)};
   if(window.estoqueForm)estoqueForm.onsubmit=e=>{e.preventDefault();set('abrigo_estoque_demo',[...estoque(),Object.fromEntries(new FormData(estoqueForm))]);render('estoque')};
   if(window.financeiroForm)financeiroForm.onsubmit=e=>{e.preventDefault();set('abrigo_financeiro_demo',[...lancamentos(),Object.fromEntries(new FormData(financeiroForm))]);render('financeiro')};
 }
 window.alterarStatus=(i,key)=>{const xs=get(key);xs[i].status='Em análise';set(key,xs);render(key==='abrigo_solicitacoes_demo'?'adocao':'role')};
 window.apagarAnimal=i=>{const xs=animais();xs.splice(i,1);set('abrigo_animais_admin',xs);render('animais')}; window.apagarEstoque=i=>{const xs=estoque();xs.splice(i,1);set('abrigo_estoque_demo',xs);render('estoque')}; window.apagarFinanceiro=i=>{const xs=lancamentos();xs.splice(i,1);set('abrigo_financeiro_demo',xs);render('financeiro')};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{render(b.dataset.tab);document.getElementById('adminSidebar').classList.remove('menu-open');document.querySelector('.admin-menu-toggle').setAttribute('aria-expanded','false')}); const menuToggle=document.querySelector('.admin-menu-toggle'); menuToggle.onclick=()=>{const aberto=document.getElementById('adminSidebar').classList.toggle('menu-open');menuToggle.setAttribute('aria-expanded',String(aberto))}; render();
}
</script></body></html>
